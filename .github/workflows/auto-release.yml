name: Auto Patch Release

on:
  workflow_run:
    workflows: [CLI quality]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: deltamod-cli-auto-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out validated main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse stale CI results
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its CI run will own the next release."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.candidate.outputs.release == 'true'
        with:
          node-version: 22.20.0
          cache: npm

      - name: Compute next compatible version
        if: steps.candidate.outputs.release == 'true'
        id: next
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const version = require('./package.json').version;
          let next;
          let prerelease = 'false';
          let match = /^(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$/.exec(version);
          if (match) {
            next = `${match[1]}.${match[2]}.${match[3]}-beta.${Number(match[4]) + 1}`;
            prerelease = 'true';
          } else {
            match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`Unsupported automatic-release version: ${version}`);
            next = `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          }
          console.log(`version=${next}`);
          console.log(`tag=v${next}`);
          console.log(`prerelease=${prerelease}`);
          NODE

      - name: Update package metadata
        if: steps.candidate.outputs.release == 'true'
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: npm version "$NEXT_VERSION" --no-git-tag-version

      - name: Commit release candidate
        if: steps.candidate.outputs.release == 'true'
        id: release
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
          PRERELEASE: ${{ steps.next.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git push origin HEAD:main
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.release_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cli-windows-x64
          - os: ubuntu-latest
            artifact: cli-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Name Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item -LiteralPath '.\deltamod-community-cli.exe' -Destination '.\deltamod-community-cli-windows-x64.exe'

      - name: Name Linux release binary
        if: runner.os == 'Linux'
        run: mv ./deltamod-community-cli ./deltamod-community-cli-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            deltamod-community-cli-windows-x64.exe
            deltamod-community-cli-linux-x64

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.release_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Tag exact release commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing tag $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          args=(release create "$TAG" release-artifacts/* --verify-tag --generate-notes --title "Deltamod Community CLI $VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"