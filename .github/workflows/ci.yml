name: CLI quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\deltamod-community-cli.exe --help

      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        run: ./deltamod-community-cli --help
