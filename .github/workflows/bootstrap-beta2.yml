# Registered-workflow trigger for the beta.2 bootstrap.
name: Bootstrap CLI 1.1.0-beta.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-beta2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deltamod-cli-bootstrap-beta2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.candidate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - name: Validate and synchronize beta.2 metadata
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.1.0-beta.2"
          git fetch origin --tags --force
          if gh release view v1.1.0-beta.2 >/dev/null 2>&1; then
            echo "release_sha=" >> "$GITHUB_OUTPUT"
            echo "v1.1.0-beta.2 is already published."
            exit 0
          fi
          npm version 1.1.0-beta.2 --no-git-tag-version --allow-same-version
          npm ci
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v1.1.0-beta.2 [skip ci]"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: prepare
    if: needs.prepare.outputs.release_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cli-windows-x64
            file: deltamod-community-cli-windows-x64.exe
          - os: ubuntu-latest
            artifact: cli-linux-x64
            file: deltamod-community-cli-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Name Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item -LiteralPath '.\deltamod-community-cli.exe' -Destination '.\deltamod-community-cli-windows-x64.exe'
      - name: Name Linux binary
        if: runner.os == 'Linux'
        run: mv ./deltamod-community-cli ./deltamod-community-cli-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.file }}

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.release_sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Tag and publish beta.2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse v1.1.0-beta.2 >/dev/null 2>&1; then
            test "$(git rev-parse v1.1.0-beta.2)" = "$RELEASE_SHA"
          else
            git tag v1.1.0-beta.2 "$RELEASE_SHA"
            git push origin refs/tags/v1.1.0-beta.2
          fi
          if ! gh release view v1.1.0-beta.2 >/dev/null 2>&1; then
            gh release create v1.1.0-beta.2 release-artifacts/* \
              --verify-tag --prerelease --generate-notes \
              --title "Deltamod Community CLI 1.1.0-beta.2"
          fi
